# Values come from a `.env` file next to this one; see docs/SERVER.md.
# The image is built and published by CI on every push to main.
services:
  mycel:
    image: ghcr.io/johnnyjack123/mycel-server:latest
    container_name: mycel
    restart: unless-stopped
    environment:
      MYCEL_JWT_SECRET: ${MYCEL_JWT_SECRET:?set MYCEL_JWT_SECRET in .env}
      MYCEL_REGISTRATION: ${MYCEL_REGISTRATION:-invite}
      MYCEL_TOKEN_TTL: ${MYCEL_TOKEN_TTL:-2592000}
      MYCEL_LOG_UPDATES: ${MYCEL_LOG_UPDATES:-false}
      MYCEL_MAX_FILE_MB: ${MYCEL_MAX_FILE_MB:-100}
      MYCEL_QUOTA_MB: ${MYCEL_QUOTA_MB:-}
      # The user the server runs as; the image hands ./data to it at every start.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "${PORT:-1234}:1234"
    volumes:
      - ./data:/data