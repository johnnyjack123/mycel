name: Build plugin

on:
  push:
    branches: ['**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession would otherwise race to move the rolling tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build:plugin

      # Pure logic, no server: the merge is the only code path able to delete a
      # user's text, and the encryption the only thing between it and the
      # server, so both are checked before anything else runs.
      - name: Merge and crypto self-test
        run: npm run test:merge

      # Imports the built bundle with Obsidian stubbed. A plugin that throws at
      # import time just fails to appear in Obsidian, with nothing in the log.
      - name: Bundle load self-test
        run: npm run test:load

      # In-process, scratch directory: accounts, access, epochs, sharing,
      # compaction, and all of it surviving a restart.
      - name: Rooms and accounts self-test
        run: npm run test:rooms

      # The editor binding on its own, through an in-process relay: a view
      # plugin that throws while being constructed is silently deactivated,
      # remote changes must stay out of undo, a wholesale reload must not
      # become a rewrite.
      - name: Editor binding self-test
        run: npm run test:sync

      # Runs its own server in-process, so it can take the server's data away
      # and restore an old copy: devices must notice, ask once, and lose
      # nothing either way.
      - name: Server data loss and rollback self-test
        run: npm run test:recovery

      # Also its own server in-process: a password change signing the other
      # devices out while they run, and nothing on them lost by it.
      - name: Account self-test
        run: npm run test:account

      # Its own server in-process: a vault rolled back to a moment from the
      # history - notes, names, files, a shared note -, the gate before it,
      # every device following, undoing it, a folder, a compacted history.
      - name: Rollback self-test
        run: npm run test:rollback

      # The backup server hands vaults to restic, so its self-test runs a real
      # one: the release the image will carry, checked against its checksum.
      - name: Install restic
        run: |
          set -euo pipefail
          curl -fsSL -o restic.bz2 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          chmod +x restic
          sudo mv restic /usr/local/bin/restic
          restic version

      # Its own sync server in-process and real devices: a vault backed up,
      # read back with restic and tar and compared, through edits, deletions,
      # a stream that breaks off and a sync server restored from a copy.
      - name: Backup self-test
        run: npm run test:backup

      # The end-to-end self-tests need a live server that lets them create
      # accounts, so start one and wait for it.
      - name: Start the sync server
        env:
          OBSIDIAN_CONNECT_REGISTRATION: open
          OBSIDIAN_CONNECT_JWT_SECRET: ci-only-secret
        run: |
          npm run start:server > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:1234/health > /dev/null; then
              echo "server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server never became healthy"
          cat server.log
          exit 1

      - name: Encrypted vault socket self-test
        run: npm run test:socket -- ws://localhost:1234

      # Three devices and a collaborator through the real store, keys and
      # binding, with Obsidian's save-and-reload modelled: that interplay
      # doubled text.
      - name: Vault sync self-test
        run: npm run test:vault -- ws://localhost:1234

      # A shared folder: its owner, a writer and a reader, devices of each.
      - name: Shared folder self-test
        run: npm run test:folders -- ws://localhost:1234

      - name: Server log
        if: always()
        run: tail -n 50 server.log || true

      - name: Assemble the plugin package
        id: package
        run: |
          set -euo pipefail
          id=$(node -p "require('./packages/plugin/manifest.json').id")
          version=$(node -p "require('./packages/plugin/manifest.json').version")
          mkdir -p "release/$id"
          cp packages/plugin/main.js \
             packages/plugin/manifest.json \
             packages/plugin/styles.css \
             "release/$id/"

          # Two zips on purpose. The nested one carries the plugin folder and is
          # what you unpack into `.obsidian/plugins/` for a first install. The
          # flat one holds the three files at the root, so updating an existing
          # install is "extract here, overwrite" without digging through a
          # wrapper directory.
          (cd release && zip -r "$id-$version.zip" "$id")
          (cd "release/$id" && zip "../$id-$version-update.zip" main.js manifest.json styles.css)

          {
            echo "id=$id"
            echo "version=$version"
            echo "zip=release/$id-$version.zip"
            echo "update_zip=release/$id-$version-update.zip"
          } >> "$GITHUB_OUTPUT"

      # Always available, including for pull requests and side branches, where
      # publishing a release would be wrong.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.id }}-${{ steps.package.outputs.version }}
          path: release/${{ steps.package.outputs.id }}/
          if-no-files-found: error

      # A tag is a real release. The loose files sit next to the zip because
      # that is what Obsidian's community plugin flow and BRAT look for.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
          UPDATE_ZIP: ${{ steps.package.outputs.update_zip }}
        run: |
          set -euo pipefail
          files=("$ZIP" "$UPDATE_ZIP" packages/plugin/main.js packages/plugin/manifest.json packages/plugin/styles.css)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "${files[@]}"
          fi

      # Every push to main refreshes one rolling pre-release instead of piling up
      # a release per commit. The tag is moved to the new commit each time.
      - name: Publish rolling development build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest-build
          ZIP: ${{ steps.package.outputs.zip }}
          UPDATE_ZIP: ${{ steps.package.outputs.update_zip }}
          ID: ${{ steps.package.outputs.id }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build $VERSION (${GITHUB_SHA:0:7})" \
            --notes "Automatic build of \`main\` at \`$GITHUB_SHA\`.

          **First install:** unzip \`$ID-$VERSION.zip\` into \`<vault>/.obsidian/plugins/\`, then enable the plugin.

          **Update an existing install:** unzip \`$ID-$VERSION-update.zip\` straight into \`<vault>/.obsidian/plugins/$ID/\` and overwrite, then reload Obsidian. Settings and local state are kept.

          This pre-release is replaced on every push to \`main\`." \
            "$ZIP" \
            "$UPDATE_ZIP" \
            packages/plugin/main.js \
            packages/plugin/manifest.json \
            packages/plugin/styles.css

  # The server image, published to the GitHub container registry once every
  # test above has passed. Only from main: `latest` is what a server pulls on
  # its next update.
  docker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The registry only takes lowercase names; account names need not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/obsidian-connect-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Nothing else runs this image before a server pulls it, so start it
      # once here: the server has to answer, and the CLI has to be able to
      # create an account in the data volume as the unprivileged user.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: obsidian-connect-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 1234:1234 -e OBSIDIAN_CONNECT_JWT_SECRET=smoke-only obsidian-connect-server:smoke
          healthy=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:1234/health > /dev/null; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            echo "::error::the container never became healthy"
            docker logs smoke
            exit 1
          fi
          docker exec smoke obsidian-connect invite
          if ! docker exec smoke obsidian-connect user list | grep -q 'invite code(s) not used yet'; then
            echo "::error::the CLI did not write the data volume"
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke
          # A bind-mounted folder that is not the server's - here the runner's - is
          # handed over at start; the admin command, run as root through docker exec,
          # writes as the server's user too; and the server itself does not run as root.
          mkdir -p hostdata
          docker run -d --name smoke-bind -p 1235:1234 -e OBSIDIAN_CONNECT_JWT_SECRET=smoke-only -v "$PWD/hostdata:/data" obsidian-connect-server:smoke
          for _ in $(seq 1 30); do curl -sf http://localhost:1235/health > /dev/null && break; sleep 1; done
          docker exec smoke-bind obsidian-connect invite
          owners=$(docker exec smoke-bind stat -c '%u' /data /data/accounts.json /proc/1 | sort -u)
          echo "owners: $owners"
          if [ "$owners" != "1000" ]; then
            echo "::error::the data folder, what the CLI wrote, or the server process is not user 1000's"
            docker logs smoke-bind
            exit 1
          fi
          docker exec smoke-bind obsidian-connect user list | grep -q 'invite code(s) not used yet'
          docker rm -f smoke-bind
          # Started as another user nothing is handed over: a folder it cannot write
          # stops it at once, saying what to do.
          mkdir -p unwritable && chmod 755 unwritable
          if out=$(docker run --rm --user 4321:4321 -e OBSIDIAN_CONNECT_JWT_SECRET=smoke-only -v "$PWD/unwritable:/data" obsidian-connect-server:smoke 2>&1); then
            echo "::error::the server started with a data folder it cannot write"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'leave "user:" out'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha

      # arm64 as well: a Raspberry Pi or a NAS is a likely home for it.
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The backup server's image. Built and started on every push - so a broken
  # Dockerfile.backup shows up on its own branch -, published from main only.
  docker-backup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/obsidian-connect-backup" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backup
          load: true
          tags: obsidian-connect-backup:smoke
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      # restic runs; an invitation is made and kept in the data volume, as the
      # unprivileged user; and the backup server, which then has a route to
      # answer, keeps running while the sync server it is pointed at does not
      # answer - it tries again, it does not die.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint restic obsidian-connect-backup:smoke version
          # restic reaches an sftp: repository through ssh.
          docker run --rm --entrypoint ssh obsidian-connect-backup:smoke -V
          # And any cloud rclone knows through rclone: a repository made, backed up into
          # and listed by restic through rclone - here rclone's local backend.
          docker run --rm --entrypoint rclone obsidian-connect-backup:smoke version
          docker run --rm --entrypoint sh obsidian-connect-backup:smoke -c '
            set -eu
            export RESTIC_PASSWORD=smoke RESTIC_REPOSITORY=rclone:/tmp/repo RESTIC_CACHE_DIR=/tmp/restic-cache
            echo hello > /tmp/note.md
            restic init
            restic backup /tmp/note.md
            restic ls latest | grep -q /tmp/note.md'
          docker volume create smoke-backup-data
          made=$(docker run --rm -v smoke-backup-data:/data obsidian-connect-backup:smoke obsidian-connect-backup invite smoke)
          echo "$made"
          code=$(echo "$made" | sed -n 2p | tr -d ' ')
          echo "$code" | grep -Eq '^([0-9A-Z]{5}-){5}[0-9A-Z]{5}$'
          listed=$(docker run --rm -v smoke-backup-data:/data obsidian-connect-backup:smoke obsidian-connect-backup invites)
          echo "$listed"
          if ! echo "$listed" | grep -q '  smoke  '; then
            echo "::error::the invitation was not kept in the data volume"
            exit 1
          fi
          docker run -d --name smoke-backup \
            -e OBSIDIAN_CONNECT_SERVER=ws://127.0.0.1:9 \
            --tmpfs /run/obsidian-connect-backup:mode=1777 \
            -v smoke-backup-data:/data \
            obsidian-connect-backup:smoke
          sleep 8
          docker logs smoke-backup
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-backup)" != true ]; then
            echo "::error::the backup server stopped"
            exit 1
          fi
          docker rm -f smoke-backup
          # Started as another user nothing is handed over: a data folder it cannot
          # write stops it at once, saying what to do, instead of it running blind.
          mkdir -p unwritable && chmod 755 unwritable
          if out=$(docker run --rm --user 4321:4321 -e OBSIDIAN_CONNECT_SERVER=ws://127.0.0.1:9 -v "$PWD/unwritable:/data" obsidian-connect-backup:smoke 2>&1); then
            echo "::error::the backup server started with a data folder it cannot write"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'leave "user:" out'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The image against a real sync server: it registers its invitation at the
      # relay, "status" says so, and "invite" sees a new one answered. Until now
      # nothing showed the image actually reaching a sync server.
      - name: Reaches a sync server
        run: |
          set -euo pipefail
          npm ci
          OBSIDIAN_CONNECT_JWT_SECRET=ci-only-secret npm run start:server > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:1234/health > /dev/null && break; sleep 1; done
          # Bind-mounted folders that are the runner's, as a fresh setup's would be someone else's:
          # handed over at start, and an invitation made through docker exec - as root - read by
          # the running backup server, which runs as user 1000.
          mkdir -p backup-bind encrypted-bind decrypted-bind
          docker run -d --name relay-backup --network host \
            -e OBSIDIAN_CONNECT_SERVER=ws://127.0.0.1:1234 \
            --tmpfs /run/obsidian-connect-backup:mode=1777 \
            -v "$PWD/backup-bind:/data" \
            -v "$PWD/encrypted-bind:/encrypted" \
            -v "$PWD/decrypted-bind:/decrypted" \
            obsidian-connect-backup:smoke
          sleep 2
          made=$(docker exec relay-backup obsidian-connect-backup invite smoke)
          echo "$made"
          status=$(docker exec relay-backup obsidian-connect-backup status)
          echo "$status"
          docker logs relay-backup
          if ! echo "$made" | grep -q 'The backup server answers it at' || ! echo "$status" | grep -Eq 'smoke .*[0-9]  answered'; then
            echo "::error::the backup server in the image did not register its invitation at the sync server"
            exit 1
          fi
          # rclone's configuration made through docker exec - as root - is the backup server's user's too.
          docker exec relay-backup rclone config touch
          owners=$(docker exec relay-backup stat -c '%u' /data /data/invites.json /data/rclone/rclone.conf /encrypted /decrypted /proc/1 | sort -u)
          echo "owners: $owners"
          if [ "$owners" != "1000" ]; then
            echo "::error::a folder, the invitation or rclone's configuration written through docker exec, or the backup server process is not user 1000's"
            exit 1
          fi
          docker rm -f relay-backup

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
