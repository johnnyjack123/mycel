# The backup server; see docs/BACKUP.md. Values come from a `.env` next to this
# file. The image is built and published by CI on every push to main.
services:
  obsidian-connect-backup:
    image: ghcr.io/johnnyjack123/obsidian-connect-backup:latest
    container_name: obsidian-connect-backup
    restart: unless-stopped
    environment:
      # The sync server, as devices are given it: wss://sync.example.com
      OBSIDIAN_CONNECT_SERVER: ${OBSIDIAN_CONNECT_SERVER:?set OBSIDIAN_CONNECT_SERVER in .env}
      # What devices are shown this backup server as.
      OBSIDIAN_CONNECT_BACKUP_NAME: ${OBSIDIAN_CONNECT_BACKUP_NAME:-backup server}
      # The user it runs as; the image hands the three folders below to it at every start.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # Its invitations, the keys of the vaults connected to it, and their encrypted cache -
      # a folder of its own, so this file can lie next to the sync server's, whose is ./data.
      - ${SERVER_DATA:-./backup-data}:/data
      # The restic repositories kept on the backup server, one folder per vault, named by its id.
      - ${ENCRYPTED_VAULTS:-./encrypted-vaults}:/encrypted
      # The decrypted copies, <account name>/<vault name> - plaintext: a disk you trust.
      - ${DECRYPTED_VAULTS:-./decrypted-vaults}:/decrypted
    # The notes of a vault lie here, decrypted, during a backup - in memory, never on a disk.
    tmpfs:
      - /run/obsidian-connect-backup:size=${RAM_DISK:-1g},mode=1777